<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f4f0" />
    <title>AI Stack Tracker</title>
    <meta name="description" content="An independent map of the compute supply chain behind frontier AI labs — from chips and datacenters to cloud, models, and applications." />
      <!-- Open Graph metadata for social previews -->
      <meta property="og:title" content="AI Stack Tracker" />
      <meta property="og:description" content="Monitoring hardware/infrastructure/service partnerships and vertical integration among frontier AI labs" />
      <meta property="og:type" content="website" />
      <meta property="og:url" content="https://aistacktracker.skellydotcom.com/" />
    <link rel="icon" type="image/png" href="/stackfav.png" />
    <!-- Typography: Fraunces (display) · Public Sans (UI) · Spline Sans Mono (data) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700&family=Spline+Sans+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <!-- Set color theme before first paint to avoid a flash of the wrong mode -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('theme');
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.classList.toggle('dark', t === 'dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
